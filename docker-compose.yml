# Der Runner wird bei Bedarf von run.sh gestartet, hier stehen nur die Editor-Dienste.
#
# editor   = Profil-Editor ohne Browser (kein Netzzugriff auf die Fritzbox nötig)
#   Start:  docker compose --profile editor up -d --build
#   Stopp:  docker compose --profile editor down
# recorder = Editor mit Live-Browser zum Aufzeichnen. Erreicht die Fritzbox, deshalb nur bei Bedarf starten.
#   Start:  docker compose --profile record up -d --build
#   Stopp:  docker compose --profile record down
# Beide Dienste teilen sich Port und Namen, starte nur einen von beiden.
# Keiner bekommt Fritzbox-Zugangsdaten (die stehen nur in runner.env).
services:
  editor:
    profiles: ["editor"]
    build:
      context: .
      dockerfile: editor/Dockerfile
    image: settings-switcher-editor
    container_name: settings-switcher-editor
    restart: "no"
    user: "${SWITCHER_UID:-1000}:${SWITCHER_GID:-1000}"
    ports:
      - "${EDITOR_BIND:-127.0.0.1}:${EDITOR_PORT:-8080}:8080"
    environment:
      EDITOR_TOKEN: ${EDITOR_TOKEN:?EDITOR_TOKEN in .env setzen (mindestens 16 Zeichen)}
      EDITOR_ALLOWED_HOSTS: ${EDITOR_ALLOWED_HOSTS:-localhost,127.0.0.1}
      EDITOR_ALLOWED_IPS: ${EDITOR_ALLOWED_IPS:-}
    volumes:
      - ./profiles:/profiles
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128

  recorder:
    profiles: ["record"]
    build:
      context: .
      dockerfile: recorder/Dockerfile
    image: settings-switcher-recorder
    container_name: settings-switcher-editor
    restart: "no"
    init: true
    user: "${SWITCHER_UID:-1000}:${SWITCHER_GID:-1000}"
    ports:
      - "${EDITOR_BIND:-127.0.0.1}:${EDITOR_PORT:-8080}:8080"
    environment:
      EDITOR_TOKEN: ${EDITOR_TOKEN:?EDITOR_TOKEN in .env setzen (mindestens 16 Zeichen)}
      EDITOR_ALLOWED_HOSTS: ${EDITOR_ALLOWED_HOSTS:-localhost,127.0.0.1}
      EDITOR_ALLOWED_IPS: ${EDITOR_ALLOWED_IPS:-}
      RECORDER_ENABLED: "1"
      SWITCHER_ALLOWED_HOSTS: ${SWITCHER_ALLOWED_HOSTS:?SWITCHER_ALLOWED_HOSTS in .env setzen (Fritzbox-IP)}
      SWITCHER_IGNORE_HTTPS_ERRORS: ${SWITCHER_IGNORE_HTTPS_ERRORS:-0}
      REC_MAX_SECONDS: ${REC_MAX_SECONDS:-600}
      REC_IDLE_SECONDS: ${REC_IDLE_SECONDS:-180}
    volumes:
      - ./profiles:/profiles
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 512
    shm_size: 256m
